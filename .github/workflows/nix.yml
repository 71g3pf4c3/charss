name: nix

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16

      - name: Flake check
        run: nix flake check --print-build-logs

      - name: Build charss
        run: nix build .#charss --print-build-logs

      - name: Smoke test
        run: ./result/bin/charss version
